<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayScore - Entrar</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css"> 

</head>
<body class="body-login">

  <section class="auth-card">
    <h2 id="tituloAuth">Entrar no PlayScore</h2>
    
    <form id="formAuth">
      <div class="campo">
        <label for="emailAuth">E-mail</label>
        <input type="email" id="emailAuth" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="campo">
        <label for="senhaAuth">Senha</label>
        <input type="password" id="senhaAuth" placeholder="Mínimo 6 caracteres" required>
      </div>

      <button type="submit" id="btnAuthSubmit" class="btn-primary">Entrar</button>
    </form>

    <div class="auth-alternar">
      <p id="textoAlternarAuth">Não tem uma conta? <a href="#" id="linkAlternarAuth">Cadastre-se</a></p>
    </div>
  </section>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script src="js/config/firebase-config.js"></script>
  <script src="js/views/login.js"></script>
</body>
</html>
